[build-system]
requires      = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "img2ascii"
version = "2.1.0"
description = "Library and a CLI tool to convert images to ascii"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
  "numpy>=2.5.4,<3",
  "requests>=2.34.2,<3",
  "urllib3>=2.8.0,<3",
  "pillow>=13.0.0,<14"
]

[project.scripts]
img2ascii = "img2ascii.__main__:main"
